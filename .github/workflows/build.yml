name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset windows --config ${{ matrix.configuration }} --parallel
      - name: Camera, chunk, terrain, and meshing core tests
        run: ctest --preset windows -C ${{ matrix.configuration }} -R "quaternion_camera|chunk_world|terrain_generation|greedy_meshing|chunk_streaming|sunlight|block_lighting|light_updates|transparent_blocks"

  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3 xorg-dev libwayland-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb xauth
      - name: Configure
        run: cmake --preset linux -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build
        run: cmake --build --preset linux --parallel
      - name: Window and Vulkan smoke test
        shell: bash
        run: |
          # Mesa updates removed the architecture suffix from ICD manifests.
          lavapipe_icd=""
          for candidate in /usr/share/vulkan/icd.d/lvp_icd.json /usr/share/vulkan/icd.d/lvp_icd.x86_64.json; do
            if [[ -r "$candidate" ]]; then
              lavapipe_icd="$candidate"
              break
            fi
          done
          if [[ -z "$lavapipe_icd" ]]; then
            echo "::error::Mesa Lavapipe Vulkan driver manifest is missing."
            ls -la /usr/share/vulkan/icd.d/
            exit 1
          fi
          echo "Using Vulkan driver: $lavapipe_icd"
          export VK_DRIVER_FILES="$lavapipe_icd"
          unset VK_ICD_FILENAMES WAYLAND_DISPLAY
          export XDG_SESSION_TYPE=x11
          # Diagnose the driver and test the game under the same Xvfb display.
          xvfb-run -a bash -e -c 'vulkaninfo --summary; ctest --preset linux'

  core-sanitizers:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone core
        run: cmake -S . -B build/core -DVOXEL_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Debug -DVOXEL_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build/core --parallel
      - name: Check memory, undefined behavior, or data races
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/core --output-on-failure
